name: Windows

# This workflow is the verification gate for apps/windows-ui. Slint compiles cross-platform, but
# Mica, DPI awareness, the embedded manifest, and native dialogs can only be confirmed on
# Windows — and the vibrancy call is deliberately compiled on macOS too, so a type error there is
# caught here rather than by someone on a Windows machine.

on:
  push:
    branches: [main]
    paths:
      - "apps/windows/**"
      - "apps/windows-ui/**"
      - ".github/workflows/windows.yml"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/windows -> target, apps/windows-ui -> target

      # The library is where the protocol lives; its tests are all offline (MockClient), so they
      # run here. The live console test stays #[ignore]d — CI has no console, and must not have
      # one: a CI runner writing to someone's Drive is exactly the failure mode this project has
      # already hit twice by accident.
      - name: Test the API client
        working-directory: apps/windows
        run: cargo test --release

      - name: Build the terminal client
        working-directory: apps/windows
        run: cargo build --release --bin drivedrop

      # The fine-grained token used from the dev machine can read check-run annotations but not
      # job logs, so a failure would otherwise be invisible without a browser. Echo the tail of the
      # build output as annotations — one line each — so `gh api .../annotations` shows the real
      # error. Harmless when the build passes.
      - name: Build the Fluent UI
        working-directory: apps/windows-ui
        shell: bash
        run: |
          set -o pipefail
          cargo build --release 2>&1 | tee build.log || {
            # CARGO_TERM_COLOR=always prefixes every line with ANSI escapes, so an anchored
            # `^error` matches nothing and this block silently produces zero annotations — which
            # is exactly how the first failure became undiagnosable. Strip the escapes first.
            sed -e 's/\x1b\[[0-9;]*m//g' build.log \
              | grep -E "^(error|warning:)" -A 6 | head -50 | while IFS= read -r line; do
                echo "::error::${line}"
              done
            exit 1
          }

      # The identity scrub cleaned `main` while the raw capture stayed reachable from refs the
      # branch-scanning never looked at. This one runs at the repo root, over every tracked file.
      - name: Check for published PII shapes
        shell: bash
        run: |
          bash tools/check-pii.sh --selftest   # a check that cannot be shown to fire is not a check
          bash tools/check-pii.sh

      # Fails the build on any warning, so the cross-platform vibrancy path cannot rot quietly.
      - name: Check for warnings
        working-directory: apps/windows-ui
        run: cargo clippy --all-targets -- -D warnings

      - name: Report the binaries
        run: |
          Get-ChildItem apps/windows/target/release/drivedrop.exe, apps/windows-ui/target/release/drivedrop-ui.exe |
            Select-Object Name, @{n="MB";e={[math]::Round($_.Length/1MB,1)}}
          # DPI awareness must be in the embedded manifest, not just requested at runtime.
          $bytes = [IO.File]::ReadAllBytes("apps/windows-ui/target/release/drivedrop-ui.exe")
          $text  = [Text.Encoding]::ASCII.GetString($bytes)
          if ($text -match "PerMonitorV2") { "manifest: PerMonitorV2 present" }
          else { throw "manifest: PerMonitorV2 MISSING - the exe will be bitmap-stretched on scaled displays" }

          # Prove windows_subsystem actually took effect, rather than trusting the attribute.
          # The bug this catches: `windows_subsystem = "main"` is invalid (only "windows" or
          # "none"), but it sits behind cfg(all(target_os = "windows", not(debug_assertions))), so
          # a macOS build never validates it and only the CI release build fails. Reading the
          # Subsystem field off the PE header tests the outcome instead of the intent.
          $peOff = [BitConverter]::ToInt32($bytes, 0x3C)
          $sub   = [BitConverter]::ToUInt16($bytes, $peOff + 24 + 68)
          if ($sub -ne 2) { throw "subsystem: expected GUI (2), got $sub - a console window opens beside the UI" }
          "subsystem: GUI (2)"

          # The terminal client is the opposite case: it must keep its console.
          $tb   = [IO.File]::ReadAllBytes("apps/windows/target/release/drivedrop.exe")
          $tpe  = [BitConverter]::ToInt32($tb, 0x3C)
          $tsub = [BitConverter]::ToUInt16($tb, $tpe + 24 + 68)
          if ($tsub -ne 3) { throw "drivedrop.exe: expected console (3), got $tsub" }
          "drivedrop.exe: console (3)"

      - uses: actions/upload-artifact@v4
        with:
          name: drivedrop-windows
          path: |
            apps/windows/target/release/drivedrop.exe
            apps/windows-ui/target/release/drivedrop-ui.exe
          if-no-files-found: error
