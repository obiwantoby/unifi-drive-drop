[package]
name = "drivedrop"
version = "0.1.0"
edition = "2021"
description = "Drag-and-drop upload + share links for UniFi Drive. Fluent / Mica."

[lib]
name = "drivedrop"
path = "src/lib.rs"

# Terminal client. The egui/Fluent front-end is not written yet (see README), so this is
# what actually exercises the API port on Windows today.
[[bin]]
name = "drivedrop"
path = "src/bin/drivedrop.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

# Upload-Metadata values are base64; `checksum` is a CRC32 of the file body.
crc32fast = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }

# TLS: rustls only, so this cross-compiles without OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "cookies", "json"] }

[dependencies.log]
version = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
